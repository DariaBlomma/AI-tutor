spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  token:
    # Access-токен короткоживущий: украденный токен живёт не больше 15 минут,
    # длинную сессию держит refresh-токен (ротация в /auth/refresh).
    expiration: 15m
  refresh-expiration: 30d

app:
  frontend-base-url: "https://recipes-app-t1kp.vercel.app"
  password-reset-ttl-minutes: 30
  rate-limit-max-requests-per-hour: 3
  mail-from: ${MAIL_FROM}